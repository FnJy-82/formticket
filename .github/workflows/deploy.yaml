name: Deploy Concert Booking (Laravel)

on:
  push:
    branches: [ "main" ] # Runs only when code is pushed to main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  laravel-tests:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, bcmath, filter, zip, sqlite3, pdo_sqlite
        tools: composer:v2
        coverage: none

    - name: Copy Environment File
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Cache Composer Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.composer/cache/files
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install Composer Dependencies
      run: composer install --prefer-dist --no-ansi --no-interaction --no-progress

    - name: Generate Application Key
      run: php artisan key:generate

    # The default phpunit.xml uses an in-memory SQLite database,
    # so no MySQL service is needed.
    - name: Run Tests
      run: php artisan test

  deploy:
    name: Deploy to formticket.mav.my.id
    needs: laravel-tests # Deploys only if the tests pass
    runs-on: ubuntu-latest

    steps:
    # Composer is installed on the server, so dependencies are built there.
    # The server's .env and database/database.sqlite are not in Git and stay untouched.
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: 22
        script_stop: true
        script: |
          cd /home/mav-formticket/htdocs/formticket.mav.my.id

          git pull origin main

          composer install --no-dev --optimize-autoloader --no-interaction --no-progress

          # Make sure the SQLite file exists before migrating
          [ -f database/database.sqlite ] || touch database/database.sqlite
          chmod 775 database
          chmod 664 database/database.sqlite

          php artisan migrate --force

          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
